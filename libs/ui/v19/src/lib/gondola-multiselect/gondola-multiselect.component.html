<div class="gondola-multiselect">
  <p-multiselect
    [options]="optionList()"
    [(ngModel)]="optionsSelect"
    [optionLabel]="optionLabel()"
    [placeholder]="placeholder()"
    [filter]="filter()"
    [filterBy]="filterBy()"
    [showClear]="showClear()"
    [maxSelectedLabels]="maxSelectedLabels()"
    styleClass="w-full md:w-80"
  />
</div>
